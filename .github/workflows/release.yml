name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/jpgomesf/pgglass
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install syft for the archive SBOMs
        uses: anchore/sbom-action/download-syft@v0
      - name: Build and publish archives, SBOMs and image
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the archives and SBOMs
        uses: actions/attest@v4
        with:
          subject-checksums: dist/checksums.txt
      - name: Read the image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -er .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the image
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
