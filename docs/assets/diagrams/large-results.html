<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Large results</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #336791;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · pgglass</p>
    <h1>Large results</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="large-results-title large-results-desc">
        <title id="large-results-title">How pgglass returns a large query result</title>
        <desc id="large-results-desc">Flowchart: rows past max_rows or max_bytes are not kept and the rest of the query is cancelled on the server; the rendered result returns inline when it fits in 10 KB, otherwise the complete result is written to a CSV file only the user can read and the tool returns a summary with the file's path, or, when the file cannot be written, the rows that fit and why.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn first, behind nodes) -->
        <line x1="176" y1="72" x2="216" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="448" y1="72" x2="488" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="588" y1="104" x2="588" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="676" y1="192" x2="736" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="588" y1="240" x2="588" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="588" y1="344" x2="588" y2="376" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="668" y1="416" x2="712" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="508" y1="416" x2="448" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="694" y="172" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="706" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="596" y="254" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="606" y="263" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>
        <rect x="678" y="396" width="24" height="12" rx="2" fill="#f5f5f5"/>
        <text x="690" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">YES</text>
        <rect x="468" y="396" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="478" y="405" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NO</text>

        <!-- Start -->
        <rect x="40" y="48" width="136" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="40" y="48" width="136" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="108" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Query runs</text>
        <text x="108" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rows stream in</text>

        <!-- Read rows up to the limits -->
        <rect x="216" y="40" width="232" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="40" width="232" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="332" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Read rows up to the limits</text>
        <text x="332" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">max_rows · max_bytes</text>
        <text x="332" y="91" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the rest is cancelled on the server</text>

        <!-- Render -->
        <rect x="488" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="488" y="40" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="588" y="62" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Render the result</text>
        <text x="588" y="78" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TSV by default</text>
        <text x="588" y="91" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cells cut at 200 chars</text>

        <!-- Decision: fits inline? -->
        <polygon points="588,144 676,192 588,240 500,192" fill="#f5f5f5"/>
        <polygon points="588,144 676,192 588,240 500,192" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="588" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fits in 10 KB?</text>

        <!-- End: inline -->
        <rect x="736" y="168" width="160" height="48" rx="20" fill="#f5f5f5"/>
        <rect x="736" y="168" width="160" height="48" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="816" y="188" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return it inline</text>
        <text x="816" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rows + row-count footer</text>

        <!-- Write the spill file (focal) -->
        <rect x="476" y="280" width="224" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="476" y="280" width="224" height="64" rx="6" fill="rgba(51,103,145,0.08)" stroke="#336791" stroke-width="1"/>
        <text x="588" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Write a CSV spill file</text>
        <text x="588" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the complete result</text>
        <text x="588" y="331" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">file 0600 · directory 0700</text>

        <!-- Decision: written? -->
        <polygon points="588,376 668,416 588,456 508,416" fill="#f5f5f5"/>
        <polygon points="588,376 668,416 588,456 508,416" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="588" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">File written?</text>

        <!-- End: summary (focal) -->
        <rect x="712" y="380" width="208" height="72" rx="20" fill="#f5f5f5"/>
        <rect x="712" y="380" width="208" height="72" rx="20" fill="rgba(51,103,145,0.08)" stroke="#336791" stroke-width="1"/>
        <text x="816" y="406" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return a summary</text>
        <text x="816" y="422" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">counts, columns, preview rows</text>
        <text x="816" y="435" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">and the file's path</text>

        <!-- End: capped fallback -->
        <rect x="248" y="388" width="200" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="248" y="388" width="200" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="348" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Return the rows that fit</text>
        <text x="348" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">and why the write failed</text>

        <!-- Callout: where the file lives -->
        <text x="64" y="252" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">readable only by you, in pgglass</text>
        <text x="64" y="270" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">under your user cache directory</text>
        <path d="M 236 265 Q 424 268 476 304" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="476" cy="304" r="2" fill="#2d3142"/>

        <!-- Callout: what the agent does -->
        <text x="920" y="492" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the agent reads or greps the file</text>
        <text x="920" y="510" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">instead of re-running the query</text>
        <path d="M 864 474 Q 870 464 864 452" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="864" cy="452" r="2" fill="#2d3142"/>

        <!-- Legend -->
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · SHAPE CARRIES TYPE</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Start / end</text>

        <rect x="208" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="240" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Step</text>

        <polygon points="364,578 376,572 388,578 376,584" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="400" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Decision</text>

        <rect x="528" y="572" width="24" height="12" rx="2" fill="rgba(51,103,145,0.08)" stroke="#336791" stroke-width="1"/>
        <text x="560" y="582" fill="#4f5d75" font-size="9" font-family="'Geist', sans-serif">Spill path (focal)</text>
      </svg>
    </div>
  </div>
</body>
</html>
